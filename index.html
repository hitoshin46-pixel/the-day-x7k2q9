<title>THE DAY</title>
<meta name="robots" content="noindex,nofollow">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* Layout: sticky counter on top, then a pixel world map or a walkable world, then a dialogue sheet and D-pad. One purple-night UI around cream, gold and pink. */
:root{
  --night:#1d1840; --panel:#2b2563; --panel2:#3a3380; --cream:#fff1d6;
  --pink:#ff7aa8; --gold:#ffc857; --teal:#4fd6c0; --ink:#2b1033; --lock:#55507a;
  --px:'DotGothic16','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
  --num:'Press Start 2P','Courier New',monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--night);color:var(--cream);font-family:var(--px);font-size:16px;line-height:1.7;
  padding-block:0 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--night);z-index:30}
#app{max-width:520px;margin:0 auto}
canvas,img.pix{image-rendering:pixelated;image-rendering:crisp-edges;image-rendering:pixelated}
canvas{display:block;width:100%;height:auto;touch-action:none;cursor:pointer}

#hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--night);padding:10px 0 8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.day{font-family:var(--num);font-size:15px;color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
.day small{font-size:9px;color:var(--cream);opacity:.7;margin-right:6px}
#where{font-size:13px;color:var(--teal);min-width:0;text-align:right;flex:1}
#snd{font:inherit;font-size:12px;cursor:pointer;color:var(--cream);background:var(--panel);border:0;padding:6px 8px;min-height:32px;box-shadow:0 0 0 2px var(--panel2)}
#snd[aria-pressed="false"]{opacity:.55}

.px{background:var(--panel);margin:4px;padding:16px;box-shadow:0 -4px 0 0 var(--cream),0 4px 0 0 var(--cream),-4px 0 0 0 var(--cream),4px 0 0 0 var(--cream)}
.frame{margin:8px 4px;box-shadow:0 0 0 4px var(--cream);background:#000}
.chap{font-family:var(--num);font-size:9px;color:var(--teal);letter-spacing:.08em;margin:0}
.per{margin:2px 0 8px;font-size:13px;color:var(--gold)}
h2{margin:6px 0 0;font-size:22px;line-height:1.3;font-weight:400;text-wrap:balance}
.txt{white-space:pre-line;margin:0 0 12px}
.btn{font:inherit;font-size:16px;cursor:pointer;background:var(--pink);color:var(--ink);border:0;padding:12px 20px;min-height:48px;
  box-shadow:inset -4px -4px 0 rgba(0,0,0,.25),inset 4px 4px 0 rgba(255,255,255,.35),0 0 0 3px var(--ink);margin:3px}
.btn:active{transform:translateY(2px)}
.btn:focus-visible,.wl:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.btn.alt{background:var(--cream)}
.btn.pulse{animation:pulse 1s steps(2,jump-none) infinite}
@keyframes pulse{50%{background:var(--gold)}}
.more{display:block;text-align:right;color:var(--pink);animation:mb .8s steps(2) infinite}@keyframes mb{50%{transform:translateY(3px)}}
.pg{align-self:center;margin-right:auto;font-size:13px;opacity:.6}
.row{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;margin-top:6px}
.dlg{display:flex;gap:14px;align-items:flex-start}
.face{flex:none;width:72px;height:72px;display:grid;place-items:center;background:var(--night);box-shadow:0 0 0 3px var(--cream)}
.face img{width:64px;height:64px}
.say{min-width:0;flex:1}
#hint{min-height:28px;margin:6px 4px 2px;text-align:center;font-size:14px;color:var(--pink)}

/* title */
.title{text-align:center;padding:20px 8px 8px;position:relative}
.title::before{content:"";position:absolute;left:12px;top:12px;width:4px;height:4px;background:var(--cream);
  box-shadow:60px 30px 0 var(--gold),140px 8px 0 var(--cream),230px 44px 0 var(--pink),300px 14px 0 var(--cream),380px 52px 0 var(--gold),440px 20px 0 var(--cream),30px 120px 0 var(--pink),470px 110px 0 var(--cream)}
.eyebrow{font-family:var(--num);font-size:9px;color:var(--teal);letter-spacing:.14em;margin:0 0 22px}
h1{margin:0;font-family:var(--num);font-weight:400;font-size:clamp(34px,13vw,64px);line-height:1.1;color:var(--gold);text-shadow:4px 4px 0 var(--pink),8px 8px 0 var(--ink)}
.hero{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin:30px 0 22px}
.hero img{width:80px;height:80px}
.sub{margin:0 0 20px;font-size:14px;opacity:.9}
.blink{animation:blink 1s steps(2,jump-none) infinite}
@keyframes blink{50%{opacity:.3}}
.small{font-size:12px;opacity:.75;margin:12px 0 0}
.small button{font:inherit;color:inherit;background:none;border:0;text-decoration:underline;cursor:pointer;padding:6px}
.credits{text-align:left;font-size:12px;line-height:1.8;margin:12px 4px 0}
.credits p{margin:0 0 6px}

/* map */
.wlist{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 4px 0}
.wl{font:inherit;cursor:pointer;min-height:52px;padding:6px 4px;color:var(--ink);background:var(--gold);border:0;display:grid;gap:0;justify-items:center;line-height:1.3;
  box-shadow:inset -3px -3px 0 rgba(0,0,0,.25),inset 3px 3px 0 rgba(255,255,255,.35),0 0 0 3px var(--ink)}
.wl b{font-family:var(--num);font-weight:400;font-size:11px}
.wl span{font-size:11px}
.wl.done{background:var(--pink)}
.wl.locked{background:var(--lock);color:var(--cream);opacity:.65;cursor:not-allowed}
.wl.cur{outline:3px solid var(--cream);outline-offset:2px}
.wl.fin{background:var(--cream)}

/* world */
.wbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 4px 0}
.wbar b{font-weight:400;font-size:16px;min-width:0}
.wbar .cnt{font-size:12px;color:var(--teal);white-space:nowrap}
#ctrl{display:grid;grid-template-columns:auto auto;justify-content:space-between;align-items:center;margin:6px 8px 0;gap:16px}
.pad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,58px);gap:4px}
.pad button,.abtn{font-family:var(--num);font-size:16px;cursor:pointer;color:var(--ink);background:var(--cream);border:0;
  box-shadow:inset -4px -4px 0 rgba(0,0,0,.22),inset 4px 4px 0 rgba(255,255,255,.5),0 0 0 3px var(--ink);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.pad button:active,.abtn:active{transform:translateY(2px)}
.pad .u{grid-column:2;grid-row:1}.pad .l{grid-column:1;grid-row:2}.pad .r{grid-column:3;grid-row:2}.pad .d{grid-column:2;grid-row:3}
.abtn{width:84px;height:84px;border-radius:50%;background:var(--pink);font-size:20px}
.keys{margin:10px 4px 0;font-size:12px;text-align:center;opacity:.6}

/* finale */
.final{text-align:center}
.final .num{font-family:var(--num);font-size:clamp(26px,9vw,44px);color:var(--gold);margin:6px 0 10px;text-shadow:3px 3px 0 var(--pink),6px 6px 0 var(--ink);font-variant-numeric:tabular-nums}
.reveal{opacity:0;transition:opacity 1.6s steps(8)}
.reveal.on{opacity:1}
.duo{display:flex;justify-content:center;align-items:flex-end;gap:6px;margin:6px 0 4px}
.duo img{width:96px;height:96px}
.duo img.mid{width:48px;height:48px;margin-bottom:24px}
.msg{font-size:20px;line-height:1.7;margin:8px 0 12px;text-wrap:balance}
.msg em{font-style:normal;color:var(--pink)}
.next20k{font-size:13px;color:var(--teal);margin:0 0 12px}
.conf{position:fixed;top:-20px;width:8px;height:8px;z-index:25;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.blink,.btn.pulse{animation:none}.conf{display:none}.reveal{transition:none}}
</style>

<main id="app">
  <header id="hud" hidden>
    <div class="day"><small>DAY</small><span id="dayN">00000</span></div>
    <div id="where"></div>
    <button id="snd" aria-pressed="true" aria-label="BGMのオンオフ">♪ ON</button>
  </header>
  <section id="stage"></section>
</main>

const KEY='theday-v1';
let SV={done:[],seen:[],muted:false};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.done)SV=Object.assign(SV,s)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(SV))}catch(e){}};
const isDone=w=>SV.done.includes(w.id);

const isSeen=(w,t)=>SV.seen.includes(seenKey(w,t));

/* ---------- sprites ---------- */
const IMG={},URLS={};
for(const k in SPR){const rows=SPR[k],n=rows.length,c=document.createElement('canvas');c.width=c.height=n;const x=c.getContext('2d');
  rows.forEach((r,y)=>{for(let i=0;i<n;i++){const col=PAL[r[i]];if(col){x.fillStyle=col;x.fillRect(i,y,1,1)}}});shade(c,rows,n);IMG[k]=c}
function shade(c,rows,n){ // light from top-left: highlight top edges, shadow bottom edges
  const x=c.getContext('2d'),on=(i,j)=>i>=0&&j>=0&&i<n&&j<n&&rows[j][i]!=='.'&&rows[j][i]!==' '&&rows[j][i]!=='K';
  const solid=(i,j)=>i>=0&&j>=0&&i<n&&j<n&&PAL[rows[j][i]];
  for(let j=0;j<n;j++)for(let i=0;i<n;i++){
    if(!on(i,j))continue;
    if(!solid(i,j-1)||rows[j-1][i]==='K'){x.fillStyle='rgba(255,255,255,.22)';x.fillRect(i,j,1,1)}
    else if(!solid(i,j+1)||rows[j+1][i]==='K'){x.fillStyle='rgba(20,10,60,.2)';x.fillRect(i,j,1,1)}
    else if(rows[j][i+1]==='K'||!solid(i+1,j)){x.fillStyle='rgba(20,10,60,.12)';x.fillRect(i,j,1,1)}
  }
}
const sprURL=k=>URLS[k]||(URLS[k]=IMG[k].toDataURL('image/png'));

/* ---------- sound ---------- */
let AC=null,master=null,cur=null,want='';
const bufs={};
const IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function ensureAudio(){
  if(AC)return;
  try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=SV.muted?0:1;
    let routed=false;
    if(IOS){try{const d=AC.createMediaStreamDestination(),a=new Audio();a.srcObject=d.stream;a.setAttribute('playsinline','');master.connect(d);a.play().catch(()=>{});routed=true}catch(e){routed=false}}
    if(!routed)master.connect(AC.destination);
  }catch(e){AC=null}
  if(AC&&AC.state!=='running')AC.resume().then(refreshSnd).catch(()=>{});
}
function refreshSnd(){
  const b=$('#snd');if(!b)return;
  if(SV.muted){b.textContent='♪ OFF';b.setAttribute('aria-pressed','false')}
  else if(!AC||AC.state!=='running'){b.textContent='♪ タップで音';b.setAttribute('aria-pressed','true')}
  else{b.textContent='♪ ON';b.setAttribute('aria-pressed','true')}
}
function unlockAudio(){
  ensureAudio();
  if(AC&&AC.state!=='running')AC.resume().then(()=>{refreshSnd();if(AC.state==='running'&&want)bgm(want)}).catch(()=>{});
  else if(want)bgm(want);
  refreshSnd();
}
['pointerdown','touchend','click','keydown'].forEach(ev=>addEventListener(ev,()=>{if(!AC||AC.state!=='running')unlockAudio()},{capture:true,passive:true}));
function beep(f=660,d=.08,type='square',v=.03){
  if(!AC||SV.muted)return;
  try{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(master);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}
}
const fanfare=()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.18,'square',.04),i*130));
function decode(k){
  if(bufs[k])return bufs[k];
  const bin=atob(BGM[k]),u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
  return bufs[k]=new Promise((res,rej)=>AC.decodeAudioData(u8.buffer,res,rej)).catch(()=>null);
}
async function bgm(k){
  want=k;
  if(!AC||!BGM[k])return;
  if(cur&&cur.key===k)return;
  const buf=await decode(k);
  if(!buf||want!==k||(cur&&cur.key===k))return;
  const t=AC.currentTime;
  if(cur){const o=cur;o.g.gain.cancelScheduledValues(t);o.g.gain.setValueAtTime(o.g.gain.value,t);o.g.gain.linearRampToValueAtTime(0,t+1);try{o.s.stop(t+1.1)}catch(e){}}
  const s=AC.createBufferSource();s.buffer=buf;s.loop=true;
  const g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.8,t+1.4);
  s.connect(g);g.connect(master);s.start();cur={key:k,s,g};
}
function setMuted(m){
  SV.muted=m;save();
  if(master)master.gain.setTargetAtTime(m?0:1,AC.currentTime,.05);
  refreshSnd();
}
document.addEventListener('visibilitychange',()=>{if(!AC)return;document.hidden?AC.suspend():AC.resume()});
$('#snd').onclick=()=>{unlockAudio();setMuted(!SV.muted);if(!SV.muted)bgm(want)};

    d.style.animationDuration=rnd(2.4,5)+'s';d.style.animationDelay=rnd(0,1.8)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),8000)}
}

function buildMap(){

  const c=off.getContext('2d');c.fillStyle='#000';
  for(const p of POLYS){c.beginPath();p.forEach(([lo,la],i)=>{const[x,y]=proj(lo,la);i?c.lineTo(x,y):c.moveTo(x,y)});c.closePath();c.fill()}
  const d=c.getImageData(0,0,MW,MH).data,land=new Uint8Array(MW*MH);
  for(let i=0;i<MW*MH;i++)land[i]=d[i*4+3]>110?1:0;
  const out=document.createElement('canvas');out.width=MW;out.height=MH;
  const o=out.getContext('2d'),img=o.createImageData(MW,MH);
  const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const SEA=hex('#2c4a8a'),SEA2=hex('#365a9f'),LAND=hex('#e7c27d'),LAND2=hex('#dbb26c'),COAST=hex('#b9803f');
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    const i=y*MW+x;let col;
    if(land[i]){const edge=(x>0&&!land[i-1])||(y<MH-1&&!land[i+MW])||(y>0&&!land[i-MW])||(x<MW-1&&!land[i+1]);col=edge?COAST:((x+y)%2?LAND:LAND2)}
    else col=((x+(y>>1)*3)%9===0&&y%3===1)?SEA2:SEA;
    img.data.set([col[0],col[1],col[2],255],i*4);

}

function drawMap(ts){
  const ctx=mapCtx;if(!ctx)return;
  ctx.drawImage(baseMap,0,0);
  // route between consecutive worlds
  for(let i=0;i<WORLDS.length-1;i++){
    const a=WORLDS[i].node,b=WORLDS[i+1].node,lit=isDone(WORLDS[i]);
    ctx.fillStyle=lit?'#fff1d6':'rgba(255,241,214,.28)';
    const n=Math.max(8,Math.round(Math.hypot(b[0]-a[0],b[1]-a[1])/3));
    for(let k=0;k<=n;k+=2){const p=arcPt(a,b,k/n);ctx.fillRect(Math.round(p[0]),Math.round(p[1]),1,1)}
  }
  lblTxt(ctx,'JAPAN',268,10);
  const blink=Math.floor(ts/380)%2===0;
  WORLDS.forEach((w,i)=>{
    const[x,y]=w.node,vi=visited(w),dn=isDone(w);
    ctx.fillStyle='#1d1840';ctx.fillRect(x-6,y-6,13,13);
    const fill=dn?'#ff7aa8':vi?'#ffc857':(blink?'#ffe08a':'#fff1d6');
    ctx.fillStyle=fill;ctx.fillRect(x-5,y-5,11,11);
    if(vi)digits(ctx,i+1,x,y,'#2b1033');else{ctx.font='9px DotGothic16,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#2b1033';ctx.fillText('?',x,y+.5)}
    lblTxt(ctx,vi?w.lab:'?',x,y+11);
  });
  if(flight){
    const f=flight,p=arcPt(f.a,f.b,f.e);
    ctx.save();ctx.translate(Math.round(p[0]),Math.round(p[1])-4);if(f.b[0]<f.a[0])ctx.scale(-1,1);ctx.drawImage(IMG.plane,-8,-8);ctx.restore();
  }else{
    const[x,y]=WORLDS[mapPos].node,bob=Math.round(Math.sin(ts/220)*1.5);

}
function mapLoop(ts){

    if(t>=1){flight=null;mapPos=f.to;busy=false;setDay(f.d1);const cb=f.cb;stopMap();cb();return}

}
function stopMap(){cancelAnimationFrame(mapRaf);mapRaf=0;mapCtx=null}

function showMap(msg){
  stopWorld();

  const allDone=WORLDS.every(isDone);
  stage.innerHTML=`<div class="frame"><canvas id="map" width="${MW}" height="${MH}" aria-label="世界地図"></canvas></div>

    <div class="wlist">${WORLDS.map((w,i)=>{const vi=visited(w),dn=isDone(w);
      return `<button class="wl ${dn?'done':''} ${i===mapPos?'cur':''}" data-i="${i}"><b>${vi?i+1:'?'}</b><span>${vi?w.name:'？？？'}</span></button>`}).join('')}
      ${allDone?'<button class="wl fin" data-i="fin"><b>★</b><span>THE DAY</span></button>':''}</div>`;
  const cv=$('#map');mapCtx=cv.getContext('2d');mapCtx.imageSmoothingEnabled=false;
  setDay(WORLDS[mapPos].day);setWhere(curDay,WORLDS[mapPos].place);
  cv.onpointerdown=e=>{

    const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*MW,y=(e.clientY-r.top)/r.height*MH;
    let best=-1,bd=14;WORLDS.forEach((w,i)=>{const d=Math.hypot(w.node[0]-x,w.node[1]-y);if(d<bd){bd=d;best=i}});
    if(best>=0)travel(best);

  document.querySelectorAll('.wl').forEach(b=>b.onclick=()=>{if(busy)return;b.dataset.i==='fin'?finale():travel(+b.dataset.i)});

const key=(x,y)=>x+','+y;
function buildSolid(w){
  const s=new Set();
  for(let x=0;x<C;x++){s.add(key(x,0));s.add(key(x,1))}
  w.deco.forEach(([sp,x,y])=>fp({spr:sp,x,y}).forEach(([a,b])=>s.add(key(a,b))));
  w.things.forEach(t=>fp(t).forEach(([a,b])=>s.add(key(a,b))));

const free=(x,y)=>x>=0&&y>=0&&x<C&&y<R&&!WS.solid.has(key(x,y));
function bfs(sx,sy){
  const dist=new Map([[key(sx,sy),0]]),prev=new Map(),q=[[sx,sy]];
  for(let i=0;i<q.length;i++){const[x,y]=q[i];
    for(const[dx,dy]of[[0,1],[1,0],[0,-1],[-1,0]]){const nx=x+dx,ny=y+dy,k=key(nx,ny);if(!dist.has(k)&&free(nx,ny)){dist.set(k,dist.get(key(x,y))+1);prev.set(k,[x,y]);q.push([nx,ny])}}}
  return{dist,prev};

function pathTo(tx,ty){

  const out=[];let c=[tx,ty];while(!(c[0]===P.x&&c[1]===P.y)){out.push(c);c=prev.get(key(c[0],c[1]))}
  return out.reverse();

}
function stopWorld(){cancelAnimationFrame(WS.raf);WS.raf=0;if(WS.keyH){removeEventListener('keydown',WS.keyH);WS.keyH=null}}
function updateCount(){const w=world(),n=w.things.filter(t=>isSeen(w,t)).length,e=$('#cnt');if(e)e.textContent=`${n}/${w.things.length}`}

function drawWorld(ctx,ts){
  const w=world();
  BACK[w.back](ctx);drawGround(ctx,w);
  const list=[];
  w.deco.forEach(([sp,x,y])=>list.push({sp,x,y,deco:true}));
  w.things.forEach(t=>list.push({sp:t.spr,x:t.x,y:t.y,t}));
  list.push({sp:'haru',x:WS.P.px/T,y:WS.P.py/T,me:true});
  list.sort((a,b)=>(a.y+(BIG.has(a.sp)?1:0))-(b.y+(BIG.has(b.sp)?1:0)));
  const moving=WS.P.path.length>0;
  for(const o of list){
    const px=Math.round(o.x*T),py=Math.round(o.y*T);
    if(o.me){ctx.fillStyle='rgba(0,0,0,.22)';ctx.fillRect(px+3,py+14,10,2);ctx.drawImage(IMG.haru,px,py+(moving?Math.round(Math.sin(ts/70)*1):0));continue}
    const bg=BIG.has(o.sp)?T:0;
    if(o.deco||!o.me){ctx.fillStyle='rgba(30,10,50,.16)';ctx.fillRect(px+2,py+T+bg-2,T-4+bg,2);ctx.fillStyle='rgba(30,10,50,.1)';ctx.fillRect(px+4,py+T+bg,T-8+bg,1)}
    if(o.deco){ctx.drawImage(IMG[o.sp],px,py);continue}
    const seen=isSeen(w,o.t),bob=seen?0:Math.round(Math.sin(ts/300+o.x)*1);
    ctx.drawImage(IMG[o.sp],px,py+bob);
    const big=BIG.has(o.sp)?T:0;
    if(!seen){if(Math.floor(ts/420+o.x+o.y)%2===0){const sx=px+T+big-5,sy=py+bob+1;rect(ctx,'#fff6c8',sx,sy+1,5,1);rect(ctx,'#fff6c8',sx+2,sy-1,1,5)}}
    else rect(ctx,'#4fd6c0',px+T+big-5,py+T+big-5,4,4);
  }
  polish(ctx);
  // name of whoever is within reach
  if(!WS.dlg){
    const near=w.things.find(adjacent),nm=near?near.name:'';
    if(nm!==WS.nearName){WS.nearName=nm;const h=$('#hint');if(h){if(nm)h.textContent=`${nm}にタップで話しかけよう`;else if(h.textContent.endsWith('タップで話しかけよう'))h.textContent=''}}
  }
}
function update(dt){
  const P=WS.P;if(!P.path.length)return;
  const[tx,ty]=P.path[0],gx=tx*T,gy=ty*T,sp=T*6.5*dt,dx=gx-P.px,dy=gy-P.py,d=Math.hypot(dx,dy);
  if(d<=sp){P.px=gx;P.py=gy;P.x=tx;P.y=ty;P.path.shift();if(!P.path.length&&P.pending){const t=P.pending;P.pending=null;talk(t)}}
  else{P.px+=dx/d*sp;P.py+=dy/d*sp}
}
function goTo(tx,ty){
  if(WS.dlg)closeDlg(true);
  const P=WS.P,t=thingAt(tx,ty);
  if(t){
    if(adjacent(t)&&!P.path.length){talk(t);return}
    const{dist}=bfs(P.x,P.y);let best=null;
    for(const[a,b]of fp(t))for(const[dx,dy]of[[0,1],[1,0],[0,-1],[-1,0]]){const nx=a+dx,ny=b+dy,d=dist.get(key(nx,ny));if(free(nx,ny)&&d!==undefined&&(!best||d<best.d))best={x:nx,y:ny,d}}
    if(!best)return;
    const p=pathTo(best.x,best.y);P.path=p||[];P.pending=t;if(!P.path.length){P.pending=null;talk(t)}
  }else if(free(tx,ty)){const p=pathTo(tx,ty);if(p){P.path=p;P.pending=null}}
}
function step(dx,dy){const P=WS.P;if(WS.dlg)closeDlg(true);if(P.path.length)return;const nx=P.x+dx,ny=P.y+dy;if(free(nx,ny)){P.path=[[nx,ny]];P.pending=null}}
function action(){
  if(WS.dlg)closeDlg(true);
  const w=world(),near=w.things.filter(adjacent).sort((a,b)=>isSeen(w,a)-isSeen(w,b));
  if(near.length)talk(near[0]);else hint('まわりに話せる人やものがいないよ');
}

/* ---------- dialogue ---------- */
function talk(t){beep(760,.08);WS.dlg={t,page:0};page()}
function page(){
  const{t,page:p}=WS.dlg,last=p===t.pages.length-1;
  $('#hint').textContent='';
  $('#sheet').innerHTML=`<div class="px"><p class="chap">${world().name}</p>
    <div class="dlg"><div class="face">${sprImg(t.spr)}</div><div class="say"><h2>${t.name}</h2></div></div>
    <p class="txt" style="margin-top:12px">${t.pages[p]}${last?'':'<span class="more">▼</span>'}</p>
    <div class="row">${t.pages.length>1?`<span class="pg">${p+1}/${t.pages.length}</span>`:''}<button class="btn" id="nx">${last?'とじる':'▶ つづく'}</button></div></div>`;
  $('#nx').onclick=()=>{beep(660,.06);if(!last){WS.dlg.page++;page();return}closeDlg()};
  $('#nx').focus({preventScroll:true});
}
function closeDlg(quiet){
  const t=WS.dlg.t,w=world();WS.dlg=null;$('#sheet').innerHTML='';WS.nearName='';
  if(!isSeen(w,t)){SV.seen.push(seenKey(w,t));save();updateCount();beep(880,.07);setTimeout(()=>beep(1175,.1),90)}
  const all=w.things.every(x=>isSeen(w,x));
  if(all&&!isDone(w)){
    SV.done.push(w.id);save();fanfare();
    if(WS.idx===WORLDS.length-1){setTimeout(finale,900);return}
    hint('ワールドクリア！ MAPにもどって次の場所へ行こう');
    const b=$('#tomap');if(b)b.classList.add('pulse');
  }
}

/* ---------- title and finale ---------- */
function showTitle(){
  stopMap();stopWorld();$('#hud').hidden=true;
  const prog=SV.done.length>0||SV.seen.length>0;
  stage.innerHTML=`<div class="title"><p class="eyebrow">A SMALL TRIP FOR HARU</p>
    <h1>THE DAY</h1>
    <div class="hero">${sprImg('haru')}${sprImg('plane')}${sprImg('suitcase')}</div>
    <p class="sub">世界をめぐる、ちいさな旅</p>
    <button class="btn blink" id="start">${prog?'つづきから':'PRESS START'}</button>
    ${prog?'<div><button class="btn alt" id="reset">はじめから</button></div>':''}
    <p class="small">presented by Hitoshi ・ <button id="cr">BGMクレジット</button></p>
    <div class="credits" id="credits" hidden>
      <p>BGM：「You've Got a Friend in Me」（Pixar／Randy Newman）</p>
      <p>個人で楽しむための使用です</p>
    </div></div>`;
  $('#start').onclick=()=>{unlockAudio();setTimeout(()=>beep(784,.1),60);$('#hud').hidden=false;setMuted(SV.muted);
    mapPos=Math.max(0,WORLDS.findIndex(w=>!isDone(w)));if(mapPos<0)mapPos=0;
    if(!SV.done.length)mapPos=0;showMap()};
  const r=$('#reset');if(r)r.onclick=()=>{SV={done:[],seen:[],muted:SV.muted};save();mapPos=0;showTitle()};
  $('#cr').onclick=()=>{const c=$('#credits');c.hidden=!c.hidden};
  bgm('friend');
}
function finale(){
  stopMap();stopWorld();bgm('friend');
  const last=WORLDS[WORLDS.length-1],d20=new Date(BIRTH+20000*864e5);
  stage.innerHTML=`<div class="px final"><p class="chap">THE DAY</p>
    <p class="num" id="fnum">DAY ${pad(last.day)}</p>
    <div class="reveal" id="rev"><div class="duo">${sprImg('haru')}${sprImg('star','mid')}${sprImg('hitoshi')}</div>
    <p class="msg">今日は生まれて10000日記念日でした！おめでとう！！！<br>次は<em>54歳</em>のときにお祝いしようね！<br>Love you baby</p>
    <p class="next20k">NEXT：DAY 20000 ＝ ${d20.getUTCFullYear()}年${d20.getUTCMonth()+1}月ごろ（54歳）</p>
    <div class="row" style="justify-content:center"><button class="btn alt" id="again">地図にもどる</button></div></div></div>`;
  setWhere(last.day,'？？？');
  const t0=performance.now(),dur=5200,from=last.day;
  const tick=ts=>{const t=Math.min(1,(ts-t0)/dur),e=1-Math.pow(1-t,3),v=from+(10000-from)*e;
    setDay(v);const n=$('#fnum');if(n)n.textContent='DAY '+pad(v);
    if(t<1)requestAnimationFrame(tick);
    else{fanfare();confetti(100);setWhere(10000,'THE DAY');const r=$('#rev');if(r)r.classList.add('on')}};
  requestAnimationFrame(tick);
  $('#again').onclick=()=>{mapPos=WORLDS.length-1;showMap()};
}

/* ---------- boot ---------- */
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>{if(!baseMap)buildMap()}).catch(()=>{});
$('#snd').textContent=SV.muted?'♪ OFF':'♪ ON';$('#snd').setAttribute('aria-pressed',String(!SV.muted));
showTitle();
})();
</script>
